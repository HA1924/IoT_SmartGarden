<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sensors | AquaControl Pro</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined&display=swap" rel="stylesheet" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-background text-on-surface min-h-screen" data-page="sensors" data-title="Sensors &amp; Data">
  <div id="sidebar-root"></div>
  <div id="topbar-root"></div>

  <main class="lg:ml-[260px] pt-24 px-4 lg:px-8 pb-12 space-y-8">
    <!-- Trạng thái theo zone -->
    <section>
      <div class="flex items-center justify-between mb-6">
        <div>
          <h2 class="text-title-md font-bold">Sensor Status by Zone</h2>
          <p class="text-body-md text-on-surface-variant">Latest data from the 3 monitored zones.</p>
        </div>
      </div>
      <div class="glass-card rounded-2xl overflow-hidden">
        <table class="w-full text-body-md">
          <thead class="bg-surface-container text-on-surface-variant text-label-sm uppercase">
            <tr>
              <th class="text-left px-5 py-3">Zone</th>
              <th class="text-left px-5 py-3">Temperature</th>
              <th class="text-left px-5 py-3">Air Humidity</th>
              <th class="text-left px-5 py-3">Light</th>
              <th class="text-left px-5 py-3">Soil Moisture</th>
              <th class="text-left px-5 py-3">Updated</th>
            </tr>
          </thead>
          <tbody id="sensor-tbody" class="divide-y divide-outline-variant/30"></tbody>
        </table>
      </div>
    </section>

    <!-- Xuất dữ liệu -->
    <section class="glass-card rounded-2xl p-6">
      <div class="flex items-center gap-3 mb-4">
        <span class="material-symbols-outlined text-primary">download</span>
        <h2 class="text-title-md font-bold">Export Data (CSV)</h2>
      </div>
      <p class="text-body-md text-on-surface-variant mb-5">Choose a time range and zone; the CSV file will be downloaded.</p>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
        <div>
          <label class="text-label-sm font-semibold uppercase text-on-surface-variant">From</label>
          <input id="exp-from" type="datetime-local" class="mt-1 w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-2 text-body-md focus:ring-2 focus:ring-primary outline-none" />
        </div>
        <div>
          <label class="text-label-sm font-semibold uppercase text-on-surface-variant">To</label>
          <input id="exp-to" type="datetime-local" class="mt-1 w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-2 text-body-md focus:ring-2 focus:ring-primary outline-none" />
        </div>
        <div>
          <label class="text-label-sm font-semibold uppercase text-on-surface-variant">Zone</label>
          <select id="exp-zone" class="mt-1 w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-2 text-body-md focus:ring-2 focus:ring-primary outline-none">
            <option value="0">All</option>
            <option value="1">Zone 1</option>
            <option value="2">Zone 2</option>
            <option value="3">Zone 3</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button id="preview-btn" class="bg-surface-container-high text-on-surface rounded-lg py-2.5 font-bold hover:bg-surface-container transition-colors flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-[18px]">visibility</span> Preview
          </button>
          <button id="exp-btn" class="bg-primary text-on-primary rounded-lg py-2.5 font-bold hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-[18px]">download</span> Download CSV
          </button>
        </div>
      </div>

      <!-- Bảng xem trước dữ liệu sẽ xuất -->
      <div id="preview-wrap" class="hidden mt-6">
        <div class="flex items-center justify-between mb-3">
          <p class="text-label-sm font-bold uppercase text-on-surface-variant">Data preview</p>
          <p id="preview-summary" class="text-label-sm text-on-surface-variant"></p>
        </div>
        <div class="glass-card rounded-2xl overflow-x-auto max-h-96 overflow-y-auto">
          <table class="w-full text-label-sm whitespace-nowrap">
            <thead class="bg-surface-container text-on-surface-variant uppercase sticky top-0">
              <tr>
                <th class="text-left px-4 py-2.5">Time</th>
                <th class="text-left px-4 py-2.5">Zone</th>
                <th class="text-left px-4 py-2.5">Temperature</th>
                <th class="text-left px-4 py-2.5">Air Humidity</th>
                <th class="text-left px-4 py-2.5">Light</th>
                <th class="text-left px-4 py-2.5">Soil Moisture</th>
              </tr>
            </thead>
            <tbody id="preview-tbody" class="divide-y divide-outline-variant/30"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/sensors.js"></script>
</body>
</html>

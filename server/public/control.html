<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control | AquaControl Pro</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined&display=swap" rel="stylesheet" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-background text-on-surface min-h-screen" data-page="control" data-title="Device Control">
  <div id="sidebar-root"></div>
  <div id="topbar-root"></div>

  <main class="lg:ml-[260px] pt-24 px-4 lg:px-8 pb-12">
    <div class="mb-6">
      <h2 class="text-title-md font-bold">Pump Control — 10 Zones</h2>
      <p class="text-body-md text-on-surface-variant">Each zone runs in one mode at a time. The <b>Water now</b> buttons work in any mode and the zone returns to its mode when the run ends.</p>
    </div>

    <section id="actuator-grid" class="grid grid-cols-1 md:grid-cols-2 2xl:grid-cols-3 gap-5">
      <!-- render bằng control.js -->
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/control.js"></script>
</body>
</html>

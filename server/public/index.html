<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overview | AquaControl Pro</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&family=Material+Symbols+Outlined&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-background text-on-surface min-h-screen" data-page="overview" data-title="Irrigation Dashboard">
  <div id="sidebar-root"></div>
  <div id="topbar-root"></div>

  <main class="lg:ml-[260px] pt-24 px-4 lg:px-8 pb-12">
    <!-- Cảnh báo -->
    <div id="alert-banner" class="hidden mb-6 p-4 bg-error-container/50 border border-error/20 rounded-xl flex items-center gap-4">
      <span class="material-symbols-outlined text-error fill-icon">warning</span>
      <div class="flex-1">
        <p id="alert-text" class="text-body-md font-bold text-on-error-container"></p>
      </div>
    </div>

    <!-- Tóm tắt nhanh -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      <div class="glass-card p-4 rounded-2xl">
        <p class="text-label-sm text-on-surface-variant uppercase font-bold">Nodes online</p>
        <p id="kpi-online" class="text-headline-lg font-bold">--</p>
      </div>
      <div class="glass-card p-4 rounded-2xl">
        <p class="text-label-sm text-on-surface-variant uppercase font-bold">Pumps running</p>
        <p id="kpi-pumps" class="text-headline-lg font-bold">--</p>
      </div>
      <div class="glass-card p-4 rounded-2xl">
        <p class="text-label-sm text-on-surface-variant uppercase font-bold">Zones needing water</p>
        <p id="kpi-dry" class="text-headline-lg font-bold">--</p>
      </div>
      <div class="glass-card p-4 rounded-2xl">
        <p class="text-label-sm text-on-surface-variant uppercase font-bold">Avg. temperature</p>
        <p id="kpi-temp" class="text-headline-lg font-bold">--</p>
      </div>
    </section>

    <!-- Lưới 10 zone -->
    <section id="zone-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-5 gap-4 mb-8">
      <!-- card zone được render bằng overview.js -->
    </section>

    <!-- Biểu đồ -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="glass-card p-6 rounded-2xl">
        <div class="flex justify-between items-center mb-6">
          <div>
            <h3 class="text-title-md font-bold">Temperature &amp; Humidity</h3>
            <p class="text-label-sm text-on-surface-variant">Average across all zones</p>
          </div>
          <select id="range-select" class="bg-surface-container border-none rounded-lg text-label-sm py-1 pl-3 pr-8 focus:ring-primary">
            <option value="24h">24 Hours</option>
            <option value="7d">7 Days</option>
            <option value="30d">30 Days</option>
            <option value="90d">90 Days</option>
          </select>
        </div>
        <div class="h-64"><canvas id="th-chart"></canvas></div>
      </div>

      <div class="glass-card p-6 rounded-2xl">
        <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
          <div>
            <h3 class="text-title-md font-bold">Soil Moisture by Zone</h3>
            <p class="text-label-sm text-on-surface-variant">Driest pot of each zone</p>
          </div>
        </div>
        <div id="soil-zone-toggles" class="flex flex-wrap gap-1.5 mb-4"></div>
        <div class="h-56"><canvas id="soil-chart"></canvas></div>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/overview.js"></script>
</body>
</html>
